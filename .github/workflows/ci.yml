name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux libraries (fontconfig for the UI's fonts)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - name: Rust toolchain (1.97.0, rustfmt, clippy)
        shell: bash
        # Pinned: CI's clippy must match the version the code was checked with.
        # Raise it on purpose (and fix any new lints) rather than following stable.
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      # Every platform's crates, so tests that run `cargo metadata --offline`
      # (capture_version) can resolve the whole graph.
      - run: cargo fetch --locked
      - run: cargo xtask ci
