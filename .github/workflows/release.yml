# Builds MoneyKeep's release files and creates the draft GitHub Release "MoneyKeep v<version>"
# with SHA256SUMS.txt (docs/specs/release-packaging.md revision 2, docs/specs/macos-release.md).
# Runs on a pushed version tag (v<version>, matching Cargo.toml) and by hand (workflow_dispatch),
# never on a pull request: the macOS job runs on the project's own Mac (a self-hosted runner;
# owner runbook docs/deploy/mac-runner.md), and `cargo xtask workflows` fails if any other
# workflow names a self-hosted runner or this one gains another trigger (W9).
# Self-contained: every job is defined here, and the only actions are GitHub's own, each pinned
# to the full commit of the tag named beside it (W8). Tools are downloaded from their publishers'
# releases and checked against a SHA-256 written here, or installed from Ubuntu's archive.
#
# Files (the names keep-launcher installs):
#   Windows  moneykeep-<ver>-windows-x64-setup.exe
#   macOS    moneykeep-<ver>-macos-universal.dmg
#   both     SHA256SUMS.txt
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "macOS build: runner (the project's Mac), github (GitHub's macos-15, signing from secrets, for when the Mac is away) or skip (no macOS file; the release text says so). A tag push always uses runner."
        type: choice
        options: [runner, github, skip]
        default: runner

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  TRUNK_VERSION: "0.21.14"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      macos: ${{ steps.v.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Resolve the version
        env:
          INPUT_MACOS: ${{ inputs.macos }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . packaging/env.sh
          v="$VERSION"
          # A tag push is a release: the tag must be the workspace version, and it always builds
          # on the project's Mac (the input exists only for workflow_dispatch).
          macos="${INPUT_MACOS:-runner}"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            macos=runner
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $v (Cargo.toml): tag v$v instead"
              exit 1
            fi
          fi
          case "$macos" in
            runner | github | skip) ;;
            *) echo "::error::macos must be runner, github or skip, not '$macos'"; exit 1 ;;
          esac
          # Stop before the long builds (and the Mac approval) when the release is already out.
          if [ "$(gh release view "v$v" --json isDraft --jq .isDraft 2>/dev/null || true)" = false ]; then
            echo "::error::Release v$v is already published. Raise the version in Cargo.toml and tag again."
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "version=$v"; echo "prerelease=$pre"; echo "macos=$macos"; } >>"$GITHUB_OUTPUT"
          echo "### MoneyKeep v$v (\`${GITHUB_SHA::9}\`), macOS: $macos" >>"$GITHUB_STEP_SUMMARY"

  # The phone app (wasm), built once and embedded by both platforms' capture server, so the Mac
  # needs neither Trunk nor wasm-opt (cargo xtask phone-app; MK_PHONE_APP in the jobs below).
  phone:
    name: Phone app (wasm)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Install wasm-opt (Binaryen, from Ubuntu) and Trunk
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binaryen
          wasm-opt --version
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.cargo/bin" -f "$RUNNER_TEMP/trunk.tar.gz" trunk
          trunk --version
      - name: Build the phone app
        run: cargo xtask phone-app --out "$RUNNER_TEMP/phone"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-app
          path: ${{ runner.temp }}/phone
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [version, phone]
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - name: NSIS
        run: |
          $nsis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not ($nsis | Where-Object { Test-Path $_ })) {
            choco install nsis -y --no-progress
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phone-app
          path: ${{ runner.temp }}/phone
      # Optional: a code-signing certificate as a .pfx without a password (MK_SIGN_PFX, base64),
      # written to a file only this job reads; cargo xtask installer signs with it (MK_SIGN_CERT,
      # release-prep.md: never a password on a command line). Without it the setup is unsigned.
      - name: Signing certificate
        env:
          MK_SIGN_PFX: ${{ secrets.MK_SIGN_PFX }}
        run: |
          if ($env:MK_SIGN_PFX) {
            $file = Join-Path $env:RUNNER_TEMP 'mk-sign.pfx'
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:MK_SIGN_PFX))
            "MK_SIGN_CERT=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Output '::warning::MK_SIGN_PFX is not set: the Windows setup is not signed'
          }
      - name: Build the setup
        env:
          MK_PHONE_APP: ${{ runner.temp }}/phone
        run: cargo xtask installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/moneykeep-*-windows-x64-setup.exe
          if-no-files-found: error
      - name: Remove the signing certificate
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'mk-sign.pfx')

  # macOS (docs/specs/macos-release.md W1-W5). By default the job runs on the project's own Mac, a
  # self-hosted runner the owner keeps (runbook: docs/deploy/mac-runner.md), and waits for the
  # owner's approval in the `mac-release` environment (O3). workflow_dispatch can send it to
  # GitHub's macos-15 instead (`macos: github`, signing from the APPLE_* secrets) or leave it out
  # (`macos: skip`); a tag push always uses the Mac. A queued job waits for the Mac (GitHub cancels
  # it after 24 hours) and the draft release waits for it: if the Mac is away, cancel and run the
  # workflow by hand with `macos: github` or `skip`.
  macos:
    name: macOS universal (${{ needs.version.outputs.macos }})
    needs: [version, phone]
    if: needs.version.outputs.macos != 'skip'
    runs-on: ${{ fromJSON(needs.version.outputs.macos == 'github' && '"macos-15"' || '["self-hosted","macOS","ARM64","mk-mac"]') }}
    timeout-minutes: 120
    environment: mac-release
    env:
      MACOS_MODE: ${{ needs.version.outputs.macos }}
    steps:
      # The runner's workspace survives between runs: check out clean and remove anything
      # untracked (W3). The build cache lives outside the workspace (next steps).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Remove untracked files
        run: git clean -ffdx
      - name: Install Rust (GitHub's Mac)
        if: env.MACOS_MODE == 'github'
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      # On the project's Mac rustup and the toolchain are installed once by the owner (runbook
      # step 4) and updated monthly; this only adds missing targets. Builds go to a kept folder
      # outside the workspace, emptied when the compiler changes, so a release rebuilds only what
      # changed.
      - name: Rust and the build folder (the project's Mac)
        if: env.MACOS_MODE == 'runner'
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cargo/env" ]; then
            # shellcheck disable=SC1091
            . "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          want="$(rustc --version)"
          dir="$HOME/mk-build/moneykeep"
          if [ -d "$dir" ] && [ "$(cat "$dir/rustc-version.txt" 2>/dev/null || true)" != "$want" ]; then
            echo "The compiler changed ($want): emptying $dir"
            rm -rf "$dir"
          fi
          mkdir -p "$dir"
          printf '%s\n' "$want" >"$dir/rustc-version.txt"
          echo "CARGO_TARGET_DIR=$dir" >>"$GITHUB_ENV"
          echo "$want; build folder $dir"
          df -h "$HOME" | tail -n 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phone-app
          path: ${{ runner.temp }}/phone
      # GitHub's Mac: the certificate and the notarization key come from the secrets in the
      # mac-release environment. Without them import-cert.sh warns and package.sh signs ad hoc.
      - name: Import the signing certificate (GitHub's Mac)
        if: env.MACOS_MODE == 'github'
        env:
          APPLE_CERTIFICATE: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.version.outputs.macos == 'github' && secrets.APPLE_API_ISSUER || '' }}
        run: bash packaging/macos/import-cert.sh
      # The project's Mac: no secret leaves GitHub. The Developer ID key and the notarytool
      # profile live in the Mac's own mk-signing keychain (runbook step 8). Until the owner enrols
      # (O1) there is none, and package.sh signs ad hoc with a warning.
      - name: Find the signing keychain (the project's Mac)
        if: env.MACOS_MODE == 'runner'
        run: bash packaging/macos/runner-keychain.sh
      - name: Build, sign, notarize
        env:
          MK_PHONE_APP: ${{ runner.temp }}/phone
        run: bash packaging/macos/package.sh --arch universal
      - name: Verify the signatures and notarization
        run: bash packaging/macos/verify.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/moneykeep-*-macos-universal.dmg
          if-no-files-found: error
      # GitHub's Mac only. On the project's Mac MACOS_KEYCHAIN is the kept mk-signing keychain,
      # which must never be deleted.
      - name: Remove the temporary keychain
        if: always() && env.MACOS_MODE == 'github'
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  release:
    name: Draft GitHub Release
    needs: [version, windows, macos]
    # Every build must succeed, except that the macOS one may be left out on purpose (`macos: skip`).
    if: >-
      ${{ !cancelled()
      && needs.version.result == 'success'
      && needs.windows.result == 'success'
      && (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && needs.version.outputs.macos == 'skip')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Create or update the draft release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          MACOS: ${{ needs.version.outputs.macos }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          title="MoneyKeep v$VERSION"
          # `macos: skip` says so at the top of the release text; a later run with a Mac build
          # takes the line out again.
          skip_mark="No macOS build in this release"
          skip_note="**$skip_mark.** The Mac build was left out of this run; the next release will have one."
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Raise the version in Cargo.toml before releasing again."
              exit 1
            fi
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            body="$(gh release view "$tag" --json body --jq .body)"
            body="$(printf '%s\n' "$body" | grep -vF "$skip_mark" || true)"
            if [ "$MACOS" = skip ]; then body="$skip_note"$'\n\n'"$body"; fi
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE" --notes "$body"
            gh release upload "$tag" --clobber -- *
          else
            pre=()
            if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
            # With --notes, gh appends the generated notes after the given text.
            notes=()
            if [ "$MACOS" = skip ]; then notes=(--notes "$skip_note"); fi
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${notes[@]}" "${pre[@]}" -- *
          fi
          if [ "$MACOS" = skip ]; then echo "$skip_note" >>"$GITHUB_STEP_SUMMARY"; fi
          { echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"; echo; sed 's/^/    /' SHA256SUMS.txt; } >>"$GITHUB_STEP_SUMMARY"
