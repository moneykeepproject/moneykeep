# MoneyKeep — EZ Chart of Accounts (default seed for new books)
#
# Clean-room note: built from general double-entry conventions (1xxx assets,
# 2xxx liabilities, 3xxx equity, 4xxx income, 5xxx cost of sales, 6xxx-8xxx
# expenses). Not derived from any other product's default list.
#
# How it's used:
#   * The New Books wizard shows the [[preset]] entries. A preset is a list of
#     account packs.
#   * When a module is switched on in Settings, its pack in [module_packs] is
#     merged in (accounts that already exist are skipped).
#   * Codes must be unique within any preset + all module packs. Packs that are
#     never combined (personal vs. nonprofit) may reuse codes.
#   * `role` ties an account to one of MoneyKeep's own lookups (opening
#     balances, imports with no category, receivables, ...), so it keeps working
#     after a rename. Each role is held by at most one account.
#   * `subtype` is a MoneyKeep account subtype (ledger-accounts.md). Contra
#     accounts (draws, accumulated depreciation, returns) are ordinary accounts of
#     their type and show as negative amounts.

schema = 1

# ---------------------------------------------------------------- presets ---

[[preset]]
id = "personal"
name = "Personal & Household"
blurb = "Bank accounts, cards, loans, everyday spending and investments."
description = """
Best for: tracking your own and your household's money — paychecks, bills, credit cards, loans and savings — when you don't need your books laid out like a tax return.

What you get:
• Bank, savings, cash and credit card accounts, plus your home, vehicles, mortgage and auto loan.
• Income for wages, bonuses, gifts, refunds and other income.
• Spending grouped the way people think about it: Housing, Utilities, Food, Transportation, Health, Personal & Lifestyle, Family, Giving, Financial and Taxes, each with a few common categories underneath.
• Investment accounts for a brokerage, CDs and retirement, with dividends, gains and fees.

Good to know: categories are organized for budgeting, not tax filing. If you itemize deductions or want tax-time totals to line up with your return, choose "Personal — Form 1040" instead. If you also earn money on the side, choose "Personal + Side Business".
"""
packs = ["core", "personal", "investments"]
modules = ["investments"]

[[preset]]
id = "sole_proprietor"
name = "Personal + Side Business"
blurb = "Household books plus a simple business section (Schedule C-style)."
description = """
Best for: one person or household that also runs a small side business (freelancing, consulting, a shop or craft business) and wants both in one set of books.

What you get:
• Everything in "Personal & Household".
• A separate business section: sales and service revenue, cost of goods sold, about 20 common business expense categories, equipment and depreciation, and a business loan.
• Owner's Capital and Owner's Draws to track money moving between you and the business.

Good to know: business accounts are numbered 4500–7999 so they never mix with household categories. The business categories are general-purpose. If you want every business account tied to a specific Schedule C line, choose "Sole Proprietor — Schedule C" (it can be combined with "Personal — Form 1040").
"""
packs = ["core", "personal", "business", "investments"]
modules = ["investments"]

[[preset]]
id = "personal_1040"
name = "Personal — Form 1040"
blurb = "Household books grouped by Form 1040 lines and schedules, so tax time is a report."
description = """
Best for: individuals and families who want tax time to be a report, not a project. Accounts are grouped by where each amount lands on IRS Form 1040 and its schedules (tax year 2025).

What you get:
• Form 1040 income: W-2 wages, tips, taxable and tax-exempt interest, dividends, IRA and pension distributions, Social Security, capital gains.
• Schedule 1: taxable state refunds, unemployment, gambling and other income, plus adjustments such as educator expenses and student loan interest.
• Schedule 1-A (new for 2025–2028): qualified car loan interest.
• Schedule A itemized deductions: medical, state and local taxes, real estate tax, mortgage interest and points, investment interest, cash and non-cash donations.
• Federal tax payments: W-2 and 1099 withholding and estimated payments, to check against your return.
• Credit-eligible costs: child and dependent care, tuition.
• Everyday spending that isn't deductible, kept in one group.
• Brokerage, CD, retirement and HSA accounts.

Good to know: each account carries a tax-line tag (for example "Sch A L5b"). Tags are reporting hints, not tax advice, and IRS line numbers can change each year. Business or rental income belongs in "Sole Proprietor — Schedule C" or a business preset.
"""
packs = ["core", "form1040", "investments"]
tax_year = 2025
modules = ["investments"]

[[preset]]
id = "schedule_c"
name = "Sole Proprietor — Schedule C"
blurb = "Business books grouped by Schedule C lines; net profit flows to Form 1040."
description = """
Best for: sole proprietors and single-member LLCs that file Schedule C with their personal return.

What you get:
• Part I income: gross receipts, returns and allowances, other business income.
• Part III cost of goods sold: purchases, labor, materials, other costs, plus an Inventory account for year-end counts.
• Part II expenses with one account per line: advertising, car and truck, commissions, contract labor, depreciation, insurance, interest, legal and professional, office, rent, repairs, supplies, taxes and licenses, travel, meals, utilities, wages.
• Part V other expenses (software, processing fees, dues, training, postage) that roll up to line 27b, plus business use of home (line 30).
• Business checking, equipment, loans, Owner's Capital and Owner's Draws.

Good to know: expense account numbers follow the Schedule C line number (7008 = line 8). Your own self-employment tax, health insurance and retirement contributions are personal, so pay them from Owner's Draws. Choose "Personal — Form 1040 + Schedule C" to keep household and business in one book.
"""
packs = ["core", "schedc"]
tax_year = 2025

[[preset]]
id = "personal_1040_schedule_c"
name = "Personal — Form 1040 + Schedule C"
blurb = "Household and sole-proprietor books in one, grouped by Form 1040 and Schedule C lines."
description = """
Best for: a sole proprietor or single-member LLC owner who wants household and business money in one set of books, with both laid out like the tax return (tax year 2025).

What you get:
• Everything in "Personal — Form 1040": wages, interest, dividends, retirement income, Schedule 1 and 1-A items, Schedule A itemized deductions, federal tax payments, credit-eligible costs and everyday spending.
• Everything in "Sole Proprietor — Schedule C": gross receipts, cost of goods sold, one expense account per Schedule C line, other expenses for line 27b, business use of home, business checking, equipment, loans, Owner's Capital and Owner's Draws.
• Brokerage, CD, retirement and HSA accounts.

Good to know: business account numbers never overlap household ones, so the two halves stay apart in reports. Pay your self-employment tax and your personal health insurance from Owner's Draws, not from business expenses. Tags are reporting hints, not tax advice.
"""
packs = ["core", "form1040", "schedc", "investments"]
tax_year = 2025
modules = ["investments"]

[[preset]]
id = "s_corp"
name = "S Corporation — Form 1120-S"
blurb = "Corporate books grouped by Form 1120-S page 1, Schedule K and Schedule L."
description = """
Best for: corporations (often LLCs) that have elected S corporation status and file Form 1120-S. Typical when the owner takes a salary plus distributions.

What you get:
• Page 1 income and deductions, including Officer Compensation (line 7) kept separate from employee wages, and an Other Deductions group for line 20.
• Schedule K items that pass straight to shareholders: interest, dividends, capital gains, tax-exempt interest, Section 179, charitable contributions, nondeductible expenses and distributions.
• A full Schedule L balance sheet: inventory, fixed assets and depreciation, loans to and from shareholders, short- and long-term notes, Capital Stock, Paid-In Capital and Retained Earnings.
• Cost of goods sold through Form 1125-A.

Good to know: owner pay must be reasonable W-2 wages before taking distributions. Distributions are equity, not an expense. Health insurance for shareholders owning more than 2% belongs in their W-2 pay. Opening Balances should be cleared to zero before Schedule L is prepared.
"""
packs = ["core", "f1120s"]
tax_year = 2025
# Re-tag shared core/module accounts for this return ("" = no tax line).
tax_overrides = { "1000" = "Sch L L1", "1050" = "Sch L L1", "1090" = "Sch L L1", "1250" = "Sch L L1", "1200" = "Sch L L2a", "2000" = "Sch L L16", "2100" = "Sch L L18", "2250" = "Sch L L18", "2270" = "Sch L L18", "4700" = "Sch K L4", "4710" = "Sch K L5a", "4720" = "Sch K L7/8a", "8850" = "1120-S L20" }

[[preset]]
id = "partnership"
name = "Partnership / Multi-Member LLC — Form 1065"
blurb = "Partnership books grouped by Form 1065 page 1, Schedule K and Schedule L, with per-partner capital."
description = """
Best for: partnerships and multi-member LLCs that file Form 1065 and issue K-1s to each partner.

What you get:
• Page 1 income and deductions, including Guaranteed Payments to Partners (line 10) kept separate from employee wages, and an Other Deductions group for line 21 (advertising goes here — Form 1065 has no advertising line).
• Schedule K items: interest, dividends, capital gains, tax-exempt interest, Section 179, charitable contributions, nondeductible expenses.
• Separate Capital and Distributions accounts for each partner (two placeholders to rename; add a pair per extra partner).
• A full Schedule L balance sheet, including loans to and from partners.
• Cost of goods sold through Form 1125-A.

Good to know: there is no Retained Earnings — each year's profit is split into the partners' capital accounts under your partnership agreement. Partners aren't employees, so they're paid through guaranteed payments or distributions, not wages.
"""
packs = ["core", "f1065"]
tax_year = 2025
tax_overrides = { "1000" = "Sch L L1", "1050" = "Sch L L1", "1090" = "Sch L L1", "1250" = "Sch L L1", "1200" = "Sch L L2a", "2000" = "Sch L L15", "2100" = "Sch L L17", "2250" = "Sch L L17", "2270" = "Sch L L17", "4700" = "Sch K L5", "4710" = "Sch K L6a", "4720" = "Sch K L8/9a", "8850" = "1065 L21" }

[[preset]]
id = "c_corp"
name = "C Corporation — Form 1120"
blurb = "Corporate books grouped by Form 1120 page 1, Schedule L, and Schedules M-1/M-2."
description = """
Best for: regular (C) corporations that file Form 1120 and pay their own federal income tax.

What you get:
• Page 1 income: receipts, dividends, interest, rents, royalties, capital gains and other income.
• Page 1 deductions with one account per line, including officer compensation, charitable contributions (deductible here, unlike pass-through entities), depreciation and Section 179, advertising and an Other Deductions group for line 26.
• Federal Income Tax Expense and Income Taxes Payable, so the books show after-tax profit.
• Schedule M-1 items that never reach the return (federal tax, fines and penalties, tax-exempt interest).
• Schedule L balance sheet with Common Stock, Paid-In Capital, Retained Earnings, Treasury Stock and Dividends Paid (Schedule M-2).

Good to know: dividends are paid from after-tax profit and aren't deductible. If your company has an S election, choose "S Corporation — Form 1120-S" instead.
"""
packs = ["core", "f1120"]
tax_year = 2025
tax_overrides = { "1000" = "Sch L L1", "1050" = "Sch L L1", "1090" = "Sch L L1", "1250" = "Sch L L1", "1200" = "Sch L L2a", "2000" = "Sch L L16", "2100" = "Sch L L18", "2250" = "Sch L L18", "2270" = "Sch L L18", "4700" = "1120 L5", "4710" = "1120 L4", "4720" = "1120 L8", "8850" = "1120 L26" }

[[preset]]
id = "small_business"
name = "Small Business"
blurb = "Business-only books with owner equity and cost of sales."
description = """
Best for: a business that wants a clean, general-purpose chart of accounts without tying it to a particular tax form — or isn't sure yet how it will file.

What you get:
• Bank, cash and credit card accounts, prepaid expenses, equipment and depreciation, payroll liabilities and a business loan.
• Owner's Capital, Owner's Draws and Retained Earnings.
• Sales, service revenue and discounts given.
• Cost of goods sold: materials, subcontractors, shipping.
• About 20 common operating expenses, from advertising to wages and home office.

Good to know: this is the easiest list to start with and rename. Once you know your tax form, the Schedule C, 1120-S, 1065 or 1120 presets give you accounts already matched to its lines. Turn on Invoicing or Bills in Settings to add receivables and payables.
"""
packs = ["core", "business"]

[[preset]]
id = "nonprofit"
name = "Nonprofit / Church"
blurb = "Contributions, restricted and unrestricted net assets, ministry/program costs."
description = """
Best for: churches, ministries and other nonprofits that track donations, restricted gifts and program spending.

What you get:
• Net Assets Without Donor Restrictions and Net Assets With Donor Restrictions, instead of owner's equity.
• Contribution income: general giving (tithes and offerings), designated or restricted gifts, grants, in-kind gifts, program and event revenue, facility rental.
• Expenses grouped as Personnel (including housing allowance), Facilities, Programs & Ministry (supplies, outreach and benevolence, missions, events) and Administration.
• Buildings and equipment with depreciation, and payroll liabilities.

Good to know: track program, management and fundraising costs with a tag on each transaction rather than separate accounts. That keeps the list short while still supporting functional-expense reports.
"""
packs = ["core", "nonprofit"]
modules = ["classes", "funds"]

[[preset]]
id = "minimal"
name = "Starter Minimum"
blurb = "Only the required accounts. Build your own list."
description = """
Best for: experienced bookkeepers or anyone who wants to build their own chart of accounts from scratch.

What you get: only the accounts MoneyKeep needs to work —
• Checking, Savings, Cash on Hand and Credit Card.
• Opening Balances, for starting balances.
• Interest Income.
• Uncategorized Income and Uncategorized Expense, where imports land when no rule matches.

Good to know: modules you turn on later (Invoicing, Bills, Expense Manager, Investments) still add their own accounts. You can import or add everything else yourself.
"""
packs = ["core"]

# Module id (Settings > Modules) -> pack merged in when the module is on.
[module_packs]
invoicing   = "sales"        # estimates, invoices, customer payments
"sales-tax" = "sales_tax"    # sales tax collected
bills       = "purchasing"   # vendor bills
expenses    = "expenses"     # expense manager / receipt capture
investments = "investments"

